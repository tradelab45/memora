name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:database
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements-dev.lock
      - run: pip install --no-deps -e services/api
      - run: ruff check services/api
      - run: pytest services/api/tests -q
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code packages/contracts/openapi.json
