[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "memora-api"
version = "0.1.0"
description = "MEMORA orchestration API foundation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.135.1", "uvicorn[standard]==0.41.0", "httpx==0.28.1", "pydantic-settings==2.13.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
