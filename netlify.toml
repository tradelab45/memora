# Netlify build for the Next.js web app in the npm workspace monorepo.
[build]
  command = "npm run build --workspace @memora/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
